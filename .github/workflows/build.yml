name: build 

on:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/build.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build.yml'
  merge_group:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build